name: Prod Backfill Operator SMS

# 운영자 신청 승인자(OperatorRequest APPROVED)에게 '1회성' 안내 문자를 보낸다. 수동 실행 전용.
#   mode=dryrun(기본): 대상 명단(전화번호 마스킹)만 출력 — 발송하지 않음. SOLAPI 시크릿 불필요.
#   mode=send        : 실제 발송. SOLAPI_* GitHub Secrets 를 docker exec -e 로 주입(앱 재배포 불필요).
# 스크립트는 배포된 이미지 안의 dist/src/scripts/backfillOperatorSms.js 를 실행한다
# (= 이 워크플로 전에 최소 1회 Deploy 가 돼 있어야 스크립트가 컨테이너에 존재).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (dryrun=명단만 / send=실발송)'
        required: true
        default: dryrun
        type: choice
        options:
          - dryrun
          - send
      since:
        description: '이 ISO 시각 이후 승인분만 (예: 2026-08-06T08:20:00Z). 비우면 전체.'
        required: false
        default: ''
        type: string

concurrency:
  group: prod-backfill-operator-sms
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run backfill (${{ inputs.mode }})
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SOLAPI_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_FROM: ${{ secrets.SOLAPI_SENDER }}
        run: |
          if [ "${{ inputs.mode }}" = "send" ] && { [ -z "$SOLAPI_KEY" ] || [ -z "$SOLAPI_SECRET" ] || [ -z "$SOLAPI_FROM" ]; }; then
            echo "SOLAPI 시크릿 미설정 — send 불가. GitHub Secrets(SOLAPI_API_KEY/SOLAPI_API_SECRET/SOLAPI_SENDER) 먼저 등록하세요."
            exit 1
          fi
          ssh_pi() { sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "$1"; }
          ssh_pi "docker exec -e SOLAPI_API_KEY='$SOLAPI_KEY' -e SOLAPI_API_SECRET='$SOLAPI_SECRET' -e SOLAPI_SENDER='$SOLAPI_FROM' badminton-prod-server node dist/src/scripts/backfillOperatorSms.js ${{ inputs.mode }} '${{ inputs.since }}'"
