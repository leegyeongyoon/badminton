name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== A) 박정영·서건윤·윤수빈 등 이름의 모든 계정 + 인증수단 + 멤버여부 ====='
          SELECT u.id, u.name, u."isGuest", u."isManaged",
                 (u."kakaoId" IS NOT NULL) AS kakao, (u.password IS NOT NULL) AS pw,
                 EXISTS (SELECT 1 FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId"
                         WHERE cm."userId"=u.id AND c.name='터닝포인트') AS tp_member,
                 (SELECT count(*) FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
                   JOIN "Club" c2 ON c2.id=cs."clubId"
                   WHERE ci."userId"=u.id AND c2.name='터닝포인트'
                     AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01') AS tp_jul_checkins
          FROM "User" u
          WHERE replace(u.name,' ','') IN ('박정영','서건윤','윤수빈','이정우','강민','곽도근','김도연','김동환')
          ORDER BY u.name, u."isGuest";

          \echo '===== B) 7월 터닝포인트 정모 체크인 유저 중 클럽 멤버가 아닌 정회원 ====='
          SELECT u.id, u.name, u."isManaged", (u."kakaoId" IS NOT NULL) AS kakao,
                 count(DISTINCT ci."clubSessionId") AS jul_checkins
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE c.name='터닝포인트' AND NOT u."isGuest"
            AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
            AND NOT EXISTS (SELECT 1 FROM "ClubMember" cm WHERE cm."userId"=u.id AND cm."clubId"=c.id)
          GROUP BY u.id, u.name, u."isManaged", u."kakaoId" ORDER BY u.name;

          \echo '===== C) 반대로: 멤버인데 0회인 38명 중 동명(공백무시) 비멤버 정회원 계정이 7월 기록 가진 케이스 ====='
          SELECT mu.name AS member_name, ou.id AS other_id, ou."isManaged" AS other_managed,
                 (ou."kakaoId" IS NOT NULL) AS other_kakao,
                 count(DISTINCT ci."clubSessionId") AS other_jul_checkins
          FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId" JOIN "User" mu ON mu.id=cm."userId"
          JOIN "User" ou ON NOT ou."isGuest" AND ou.id<>mu.id AND replace(ou.name,' ','')=replace(mu.name,' ','')
          JOIN "CheckIn" ci ON ci."userId"=ou.id
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" AND cs."clubId"=c.id
            AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          WHERE c.name='터닝포인트' AND NOT mu."isGuest"
          GROUP BY mu.name, ou.id, ou."isManaged", ou."kakaoId" ORDER BY mu.name;
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
