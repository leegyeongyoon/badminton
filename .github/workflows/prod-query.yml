name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== A) 해당 유저 상태 ====='
          SELECT id, name, "isGuest", "isManaged" FROM "User" WHERE name IN ('오혜영','서건윤');

          \echo '===== B) 해당 유저 체크인 — 정모 연결 여부 ====='
          SELECT u.name, ci."clubSessionId" IS NOT NULL AS linked, ci."checkedInAt", cs."startedAt" AS session_start
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          LEFT JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
          WHERE u.name IN ('오혜영','서건윤') ORDER BY u.name, ci."checkedInAt";

          \echo '===== C) 해당 유저 게임 참여 — 상태별 ====='
          SELECT u.name, g.status, ct."clubSessionId" IS NOT NULL AS turn_linked, count(*)
          FROM "GamePlayer" gp JOIN "User" u ON u.id=gp."userId"
          JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
          WHERE u.name IN ('오혜영','서건윤') GROUP BY 1,2,3 ORDER BY 1;

          \echo '===== D) 7월 정모 목록 ====='
          SELECT cs.id, c.name AS club, cs.status, cs."startedAt"
          FROM "ClubSession" cs JOIN "Club" c ON c.id=cs."clubId"
          WHERE cs."startedAt" >= '2026-07-01' AND cs."startedAt" < '2026-08-01' ORDER BY cs."startedAt";

          \echo '===== E) 7월 정모별 — 연결 체크인 수 vs 게임 참여자 수 ====='
          SELECT cs."startedAt"::date AS day, c.name AS club,
            (SELECT count(DISTINCT ci."userId") FROM "CheckIn" ci WHERE ci."clubSessionId"=cs.id) AS linked_checkins,
            (SELECT count(DISTINCT gp."userId") FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              WHERE ct."clubSessionId"=cs.id AND g.status IN ('IN_PROGRESS','COMPLETED')) AS game_players
          FROM "ClubSession" cs JOIN "Club" c ON c.id=cs."clubId"
          WHERE cs."startedAt" >= '2026-07-01' AND cs."startedAt" < '2026-08-01' ORDER BY cs."startedAt";

          \echo '===== F) 7월 정모 미연결 체크인(clubSessionId null) — 날짜별 ====='
          SELECT ci."checkedInAt"::date AS day, count(*) AS unlinked_checkins, count(DISTINCT ci."userId") AS users
          FROM "CheckIn" ci
          WHERE ci."clubSessionId" IS NULL AND ci."checkedInAt" >= '2026-07-01' AND ci."checkedInAt" < '2026-08-01'
          GROUP BY 1 ORDER BY 1;

          \echo '===== G) 7월 게임 status 분포 ====='
          SELECT g.status, count(*) FROM "Game" g
          JOIN "CourtTurn" ct ON ct.id=g."turnId" JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
          WHERE cs."startedAt" >= '2026-07-01' AND cs."startedAt" < '2026-08-01' GROUP BY 1;

          \echo '===== H) 7월 정모에서 게임은 뛰었지만 CANCELLED 만 있는 유저 수 ====='
          SELECT count(DISTINCT gp."userId") FROM "GamePlayer" gp
          JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
          JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
          WHERE cs."startedAt" >= '2026-07-01' AND cs."startedAt" < '2026-08-01'
            AND NOT EXISTS (
              SELECT 1 FROM "GamePlayer" gp2 JOIN "Game" g2 ON g2.id=gp2."gameId"
              JOIN "CourtTurn" ct2 ON ct2.id=g2."turnId"
              WHERE gp2."userId"=gp."userId" AND ct2."clubSessionId"=ct."clubSessionId"
                AND g2.status IN ('IN_PROGRESS','COMPLETED'))
            AND NOT EXISTS (
              SELECT 1 FROM "CheckIn" ci WHERE ci."userId"=gp."userId" AND ci."clubSessionId"=ct."clubSessionId");
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
