name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== 1) 터닝포인트 클럽 ID/멤버 중 해당 이름 ====='
          SELECT c.id AS club_id, u.id AS user_id, u.name, u."isGuest"
          FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId" JOIN "User" u ON u.id=cm."userId"
          WHERE c.name='터닝포인트' AND (u.name LIKE '%오혜영%' OR u.name LIKE '%서건윤%');

          \echo '===== 2) 이름 유사 계정 전부(공백 포함) ====='
          SELECT id, name, "isGuest", "createdAt"::date FROM "User"
          WHERE replace(name,' ','') LIKE '%오혜영%' OR replace(name,' ','') LIKE '%서건윤%';

          \echo '===== 3) 계정별 7월 기록(체크인/게임) — 위 이름 유사 계정 전체 ====='
          SELECT u.id, u.name, u."isGuest",
            (SELECT count(*) FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
              WHERE ci."userId"=u.id AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01') AS jul_checkins,
            (SELECT count(DISTINCT ct."clubSessionId") FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
              WHERE gp."userId"=u.id AND g.status IN ('IN_PROGRESS','COMPLETED')
                AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01') AS jul_game_sessions
          FROM "User" u
          WHERE replace(u.name,' ','') LIKE '%오혜영%' OR replace(u.name,' ','') LIKE '%서건윤%';

          \echo '===== 4) 터닝포인트 멤버 중 7월 출석 0회(체크인+게임 기준) 목록 ====='
          SELECT u.name, u.id
          FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId" JOIN "User" u ON u.id=cm."userId"
          WHERE c.name='터닝포인트' AND NOT u."isGuest"
            AND NOT EXISTS (SELECT 1 FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
              WHERE ci."userId"=u.id AND cs."clubId"=c.id AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01')
            AND NOT EXISTS (SELECT 1 FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
              WHERE gp."userId"=u.id AND g.status IN ('IN_PROGRESS','COMPLETED')
                AND cs."clubId"=c.id AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01')
          ORDER BY u.name;

          \echo '===== 5) 위 0회 멤버와 동명(공백 무시)의 게스트 계정이 7월 기록을 가진 케이스 ====='
          SELECT u.name AS member_name, gu.id AS guest_id, gu.name AS guest_name,
            (SELECT count(DISTINCT ct."clubSessionId") FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
              WHERE gp."userId"=gu.id AND g.status IN ('IN_PROGRESS','COMPLETED')
                AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01') AS guest_jul_sessions
          FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId" JOIN "User" u ON u.id=cm."userId"
          JOIN "User" gu ON gu."isGuest" AND replace(gu.name,' ','')=replace(u.name,' ','')
          WHERE c.name='터닝포인트' AND NOT u."isGuest"
            AND NOT EXISTS (SELECT 1 FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
              WHERE ci."userId"=u.id AND cs."clubId"=c.id AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01')
            AND NOT EXISTS (SELECT 1 FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
              WHERE gp."userId"=u.id AND g.status IN ('IN_PROGRESS','COMPLETED')
                AND cs."clubId"=c.id AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01')
          ORDER BY u.name;
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
