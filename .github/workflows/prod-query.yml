name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== A) 터닝포인트 아닌 클럽의 7월 정모 — 체크인 명단 ====='
          SELECT c.name AS club, cs."startedAt"::date AS day, u.name, u."isGuest",
                 EXISTS (SELECT 1 FROM "ClubMember" cm JOIN "Club" tc ON tc.id=cm."clubId"
                         WHERE cm."userId"=u.id AND tc.name='터닝포인트') AS is_tp_member
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE c.name<>'터닝포인트' AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          ORDER BY cs."startedAt", u.name;

          \echo '===== B) 그 정모들에서 박정영·서건윤·윤수빈·이정우 있나 ====='
          SELECT c.name AS club, cs."startedAt"::date AS day, u.name
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE u.name IN ('박정영','서건윤','윤수빈','이정우','오혜영','강민','곽도근')
            AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          ORDER BY u.name, cs."startedAt";

          \echo '===== C) 박정영 전체 기록(월·클럽별) ====='
          SELECT to_char(cs."startedAt",'YYYY-MM') AS month, c.name AS club,
                 count(DISTINCT ci."clubSessionId") AS sessions
          FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE ci."userId"='f7824de3-8d76-45c7-a497-774f1453dc79'
          GROUP BY 1,2 ORDER BY 1;

          \echo '===== D) 이경윤/기타 클럽 7월 정모 개요(제목·체크인 수) ====='
          SELECT c.name AS club, cs.id, cs.title, cs.status, cs."startedAt",
                 (SELECT count(*) FROM "CheckIn" ci WHERE ci."clubSessionId"=cs.id) AS checkins
          FROM "ClubSession" cs JOIN "Club" c ON c.id=cs."clubId"
          WHERE c.name<>'터닝포인트' AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          ORDER BY cs."startedAt";
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
