name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST_AWS }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD_AWS }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== A) 8월 정모 전부(클럽 명의·체크인·게임 참여자) ====='
          SELECT c.name AS club, cs.id, cs.status, cs."startedAt",
            (SELECT count(DISTINCT ci."userId") FROM "CheckIn" ci WHERE ci."clubSessionId"=cs.id) AS checkins,
            (SELECT count(DISTINCT gp."userId") FROM "GamePlayer" gp
              JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
              WHERE ct."clubSessionId"=cs.id AND g.status IN ('IN_PROGRESS','COMPLETED')) AS game_players
          FROM "ClubSession" cs JOIN "Club" c ON c.id=cs."clubId"
          WHERE cs."startedAt" >= '2026-07-31' ORDER BY cs."startedAt";

          \echo '===== B) 8월 터닝포인트 세션 체크인한 멤버 수 vs 게스트 수 ====='
          SELECT u."isGuest", count(DISTINCT u.id)
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE c.name='터닝포인트' AND cs."startedAt" >= '2026-07-31'
          GROUP BY 1;

          \echo '===== C) 터닝포인트 멤버 중 8월 출석(체크인∪게임) 있는 인원 수 ====='
          SELECT count(*) FROM "ClubMember" cm
          JOIN "Club" c ON c.id=cm."clubId" AND c.name='터닝포인트'
          JOIN "User" u ON u.id=cm."userId" AND NOT u."isGuest"
          WHERE EXISTS (SELECT 1 FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
                        WHERE ci."userId"=u.id AND cs."clubId"=c.id AND cs."startedAt">='2026-08-01')
             OR EXISTS (SELECT 1 FROM "GamePlayer" gp JOIN "Game" g ON g.id=gp."gameId"
                        JOIN "CourtTurn" ct ON ct.id=g."turnId" JOIN "ClubSession" cs2 ON cs2.id=ct."clubSessionId"
                        WHERE gp."userId"=u.id AND g.status IN ('IN_PROGRESS','COMPLETED')
                          AND cs2."clubId"=c.id AND cs2."startedAt">='2026-08-01');
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER_AWS }}@${{ secrets.SSH_HOST_AWS }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
