name: Prod Query

# 프로덕션 DB를 '읽기 전용(SELECT)'으로 진단 조회한다. 배포/변경 없음.
# 사용자(가입 회원) 구성이 왜 그 숫자인지 등을 실데이터로 분해해 Actions 로그에 출력.
# SQL 을 파일로 만들어 base64 로 전달(따옴표 이스케이프 회피) → docker exec psql stdin.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-query
  cancel-in-progress: true

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Run read-only breakdown queries
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          # 단일따옴표 heredoc = 변수/따옴표 확장 없음(안전). 읽기 전용 SELECT 만.
          # 이번 조사: 출석왕 0회로 새는 멤버(오혜영·서건윤 등) — 체크인/게임 기록 분해.
          cat > q.sql <<'SQL'
          \echo '===== A) 건윤 포함 계정 전부(게스트 포함) ====='
          SELECT id, name, "isGuest", "createdAt"::date FROM "User"
          WHERE replace(name,' ','') LIKE '%건윤%';

          \echo '===== B) 서건윤 정회원 계정 — 월별 체크인·게임 세션 ====='
          SELECT to_char(cs."startedAt",'YYYY-MM') AS month,
                 count(DISTINCT ci."clubSessionId") AS checkin_sessions
          FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id=ci."clubSessionId"
          WHERE ci."userId"='8004d492-422b-4b27-84da-589e0e1559c7' GROUP BY 1 ORDER BY 1;
          SELECT to_char(cs."startedAt",'YYYY-MM') AS month,
                 count(DISTINCT ct."clubSessionId") AS game_sessions
          FROM "GamePlayer" gp JOIN "Game" g ON g.id=gp."gameId"
          JOIN "CourtTurn" ct ON ct.id=g."turnId" JOIN "ClubSession" cs ON cs.id=ct."clubSessionId"
          WHERE gp."userId"='8004d492-422b-4b27-84da-589e0e1559c7' GROUP BY 1 ORDER BY 1;

          \echo '===== C) 7월 터닝포인트 정모에서 게임 뛴 게스트 명단(운영자 식별용) ====='
          SELECT u.name, count(DISTINCT ct."clubSessionId") AS sessions, count(*) AS games,
                 min(cs."startedAt"::date) AS first_day, max(cs."startedAt"::date) AS last_day
          FROM "GamePlayer" gp JOIN "User" u ON u.id=gp."userId"
          JOIN "Game" g ON g.id=gp."gameId" JOIN "CourtTurn" ct ON ct.id=g."turnId"
          JOIN "ClubSession" cs ON cs.id=ct."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE u."isGuest" AND c.name='터닝포인트' AND g.status IN ('IN_PROGRESS','COMPLETED')
            AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          GROUP BY u.name ORDER BY u.name;

          \echo '===== D) 7월 터닝포인트 정모 체크인만 있는(게임 무관) 게스트 명단 ====='
          SELECT u.name, count(DISTINCT ci."clubSessionId") AS checkin_sessions
          FROM "CheckIn" ci JOIN "User" u ON u.id=ci."userId"
          JOIN "ClubSession" cs ON cs.id=ci."clubSessionId" JOIN "Club" c ON c.id=cs."clubId"
          WHERE u."isGuest" AND c.name='터닝포인트'
            AND cs."startedAt">='2026-07-01' AND cs."startedAt"<'2026-08-01'
          GROUP BY u.name ORDER BY u.name;
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -f -"
