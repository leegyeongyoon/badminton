name: Prod Merge Guests

# 2차 일회성: 터닝포인트 동명(공백 무시) 중복 멤버 계정 정리.
# 같은 이름의 멤버 계정이 2개(명부/전화 + 카카오 로그인)라 출석왕에 두 줄
# (한쪽 0회)로 보이던 문제 — 기록·회비가 전혀 없는 빈 계정의 멤버십만 제거한다.
# 계정 자체와 기록은 건드리지 않는다. 대표(LEADER)는 제외.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-merge-guests
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Remove empty duplicate memberships
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          cat > q.sql <<'SQL'
          BEGIN;

          -- 빈(기록·회비 0) 중복 계정 멤버십 후보
          CREATE TEMP TABLE empty_dups ON COMMIT DROP AS
          SELECT cm.id AS cm_id, u.id AS user_id, u.name
          FROM "ClubMember" cm
          JOIN "Club" c ON c.id = cm."clubId" AND c.name = '터닝포인트'
          JOIN "User" u ON u.id = cm."userId" AND NOT u."isGuest"
          WHERE cm.role <> 'LEADER'
            -- 이 클럽 기록 없음
            AND NOT EXISTS (SELECT 1 FROM "CheckIn" ci JOIN "ClubSession" cs ON cs.id = ci."clubSessionId"
                            WHERE ci."userId" = u.id AND cs."clubId" = c.id)
            AND NOT EXISTS (SELECT 1 FROM "GamePlayer" gp JOIN "Game" g ON g.id = gp."gameId"
                            JOIN "CourtTurn" ct ON ct.id = g."turnId"
                            JOIN "ClubSession" cs2 ON cs2.id = ct."clubSessionId"
                            WHERE gp."userId" = u.id AND cs2."clubId" = c.id)
            -- 회비 납부 기록 없음
            AND NOT EXISTS (SELECT 1 FROM "DuesPayment" dp WHERE dp."userId" = u.id AND dp."clubId" = c.id)
            -- 같은 이름(공백 무시)의 "기록 있는" 멤버 계정이 존재
            AND EXISTS (
              SELECT 1 FROM "ClubMember" cm2 JOIN "User" u2 ON u2.id = cm2."userId"
              WHERE cm2."clubId" = c.id AND cm2."userId" <> u.id AND NOT u2."isGuest"
                AND replace(u2.name, ' ', '') = replace(u.name, ' ', '')
                AND (EXISTS (SELECT 1 FROM "CheckIn" x JOIN "ClubSession" xs ON xs.id = x."clubSessionId"
                             WHERE x."userId" = u2.id AND xs."clubId" = c.id)
                  OR EXISTS (SELECT 1 FROM "GamePlayer" y JOIN "Game" g2 ON g2.id = y."gameId"
                             JOIN "CourtTurn" ct2 ON ct2.id = g2."turnId"
                             JOIN "ClubSession" ys ON ys.id = ct2."clubSessionId"
                             WHERE y."userId" = u2.id AND ys."clubId" = c.id)));

          \echo '===== 제거 대상(빈 중복 멤버십) ====='
          SELECT name, user_id FROM empty_dups ORDER BY name;

          \echo '===== 멤버십 제거 ====='
          DELETE FROM "ClubMember" cm USING empty_dups e WHERE cm.id = e.cm_id;

          \echo '===== 사후: 남은 동명 멤버 그룹(수동 처리 대상) ====='
          SELECT replace(u.name,' ','') AS norm_name, count(*) AS accounts
          FROM "ClubMember" cm JOIN "Club" c ON c.id=cm."clubId" AND c.name='터닝포인트'
          JOIN "User" u ON u.id=cm."userId" AND NOT u."isGuest"
          GROUP BY 1 HAVING count(*) > 1 ORDER BY 1;

          COMMIT;
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -v ON_ERROR_STOP=1 -f -"
