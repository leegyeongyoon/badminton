name: Prod Merge Guests

# 2차 일회성: 터닝포인트 동명(공백 무시) 중복 멤버 계정 정리.
# 같은 이름의 멤버 계정이 2개(명부/전화 + 카카오 로그인)라 출석왕에 두 줄
# (한쪽 0회)로 보이던 문제 — 기록·회비가 전혀 없는 빈 계정의 멤버십만 제거한다.
# 계정 자체와 기록은 건드리지 않는다. 대표(LEADER)는 제외.
# 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

concurrency:
  group: prod-merge-guests
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install cloudflared + sshpass
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << SSHCONFIG
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHCONFIG

      - name: Remove empty duplicate memberships
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          cat > q.sql <<'SQL'
          BEGIN;
          \echo '===== 진단용 임시 계정 + 터닝포인트 멤버십 생성 ====='
          INSERT INTO "User" (id, phone, password, name, "isGuest", "createdAt", "updatedAt")
          VALUES ('diag-tmp-user-0001', '01999999999', '$2a$10$qWtchEB.bIiSjLyosiyOEuV1.FvL1kjubDx3pQ7edg5wbKQVWBsee', '진단계정', false, now(), now())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO "ClubMember" (id, "userId", "clubId", role)
          SELECT 'diag-tmp-cm-0001', 'diag-tmp-user-0001', c.id, 'MEMBER'::"ClubMemberRole"
          FROM "Club" c WHERE c.name='터닝포인트'
          ON CONFLICT DO NOTHING;
          SELECT 'created';
          COMMIT;T;
          SQL

          B64=$(base64 -w0 q.sql)
          sshpass -e ssh -o ConnectTimeout=25 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo $B64 | base64 -d | docker exec -i badminton-prod-db psql -U badminton -d badminton -P pager=off -v ON_ERROR_STOP=1 -f -"
